<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>HTTPeek - Next Gen HTTP Debugging Tool</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #080B10;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: #F3F4F6;
        }
        #app-loader {
            position: fixed;
            inset: 0;
            z-index: 99999;
            background: #080B10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            user-select: none;
            overflow: hidden;
            transition: opacity 0.5s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.5s;
        }
        .loader-bg-glow {
            position: absolute;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(16, 185, 129, 0.18) 0%, rgba(6, 182, 212, 0.12) 40%, rgba(99, 102, 241, 0.08) 70%, transparent 100%);
            filter: blur(80px);
            animation: pulse-glow 6s ease-in-out infinite alternate;
            pointer-events: none;
        }
        @keyframes pulse-glow {
            0% { transform: scale(0.8) translate(-20px, -20px); opacity: 0.7; }
            100% { transform: scale(1.2) translate(20px, 20px); opacity: 1; }
        }
        .loader-content {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 24px;
            max-width: 900px;
        }
        .svg-icon-container {
            width: 96px;
            height: 96px;
            margin-bottom: 24px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .svg-path-trace {
            width: 100%;
            height: 100%;
            overflow: visible;
        }
        .trace-line {
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
            stroke-dasharray: 200;
            stroke-dashoffset: 200;
            animation: draw-path 2.4s ease-in-out infinite;
        }
        .trace-glow {
            filter: drop-shadow(0 0 12px #10B981);
        }
        @keyframes draw-path {
            0% {
                stroke-dashoffset: 200;
                opacity: 0.3;
            }
            50% {
                stroke-dashoffset: 0;
                opacity: 1;
            }
            100% {
                stroke-dashoffset: -200;
                opacity: 0.3;
            }
        }
        .main-brand-title {
            font-size: clamp(3.5rem, 9vw, 6.5rem);
            font-weight: 900;
            letter-spacing: -0.04em;
            line-height: 1;
            background: linear-gradient(135deg, #10B981 0%, #06B6D4 30%, #8B5CF6 65%, #F59E0B 100%);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradient-flow 5s ease infinite;
            margin-bottom: 16px;
            text-shadow: 0 0 40px rgba(16, 185, 129, 0.3);
        }
        @keyframes gradient-flow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .sub-heading-pill {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 8px 20px;
            border-radius: 9999px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            font-size: clamp(0.85rem, 2vw, 1.15rem);
            font-weight: 700;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            color: #94A3B8;
            margin-bottom: 32px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        }
        .sub-heading-highlight {
            background: linear-gradient(90deg, #10B981, #06B6D4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .progress-bar-container {
            width: 280px;
            height: 4px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 9999px;
            overflow: hidden;
            position: relative;
        }
        .progress-bar-fill {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 40%;
            background: linear-gradient(90deg, #10B981, #06B6D4, #8B5CF6);
            border-radius: 9999px;
            animation: progress-slide 1.8s cubic-bezier(0.65, 0, 0.35, 1) infinite;
            box-shadow: 0 0 12px #10B981;
        }
        @keyframes progress-slide {
            0% { left: -40%; width: 30%; }
            50% { width: 60%; }
            100% { left: 100%; width: 30%; }
        }
        .loader-status-text {
            margin-top: 14px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            color: #64748B;
            letter-spacing: 0.08em;
        }
    </style>
</head>
<body>
    <!-- Full-Screen SVG Animated Loading Experience -->
    <div id="app-loader">
        <div class="loader-bg-glow"></div>
        <div class="loader-content">
            <div class="svg-icon-container">
                <svg class="svg-path-trace trace-glow" viewBox="0 0 96 96">
                    <!-- Circuit Hexagon Outer Path -->
                    <path class="trace-line" stroke="#10B981" stroke-width="2.5" d="M48 6 L84 26 L84 70 L48 90 L12 70 L12 26 Z" />
                    <!-- Interceptor Bolt / Packet Stream -->
                    <path class="trace-line" stroke="#06B6D4" stroke-width="3" d="M52 18 L28 50 L46 50 L42 78 L68 44 L48 44 Z" />
                    <!-- Pulse Nodes -->
                    <circle cx="48" cy="6" r="3" fill="#10B981" />
                    <circle cx="84" cy="26" r="3" fill="#06B6D4" />
                    <circle cx="84" cy="70" r="3" fill="#8B5CF6" />
                    <circle cx="48" cy="90" r="3" fill="#F59E0B" />
                    <circle cx="12" cy="70" r="3" fill="#10B981" />
                    <circle cx="12" cy="26" r="3" fill="#06B6D4" />
                </svg>
            </div>

            <h1 class="main-brand-title">HTTPeek</h1>

            <div class="sub-heading-pill">
                <span>Next-Gen</span>
                <span class="sub-heading-highlight">HTTP / HTTPS / QUIC</span>
                <span>Workbench</span>
            </div>

            <div class="progress-bar-container">
                <div class="progress-bar-fill"></div>
            </div>

            <div class="loader-status-text">
                INITIALIZING MULTI-PROTOCOL INTERCEPT ENGINE…
            </div>
        </div>
    </div>

    <div id="root"></div>

    <script>
        // Dismiss loading screen seamlessly when React App mounts
        window.addEventListener('DOMContentLoaded', () => {
            const checkReady = setInterval(() => {
                const root = document.getElementById('root');
                if (root && root.children.length > 0) {
                    clearInterval(checkReady);
                    const loader = document.getElementById('app-loader');
                    if (loader) {
                        loader.style.opacity = '0';
                        setTimeout(() => {
                            loader.style.display = 'none';
                        }, 500);
                    }
                }
            }, 50);
            // Safety timeout
            setTimeout(() => {
                const loader = document.getElementById('app-loader');
                if (loader) {
                    loader.style.opacity = '0';
                    setTimeout(() => { loader.style.display = 'none'; }, 500);
                }
            }, 3000);
        });
    </script>
    <script src="./src/main.tsx" type="module"></script>
</body>
</html>
